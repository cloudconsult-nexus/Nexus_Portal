# Cloud Build CI/CD — for ongoing deploys after the initial bootstrap via
# scripts/deploy.sh (which creates the infra and captures the first API URL).
#
# Wire this up with:
#   gcloud builds triggers create github \
#     --repo-name=<your-repo> --repo-owner=<you> --branch-pattern='^main$' \
#     --build-config=cloudbuild.yaml
#
# Substitution _API_URL should be set to the deployed API's URL (find it with
# `gcloud run services describe oncall-pro-api --format='value(status.url)'`)
# so the frontend build bakes in the right VITE_API_URL. Set it as a trigger
# substitution in the Cloud Build console/CLI — it won't change often.

steps:
  # ── API ────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP_NAME}-images/api:${SHORT_SHA}', './backend']
    id: build-api

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP_NAME}-images/api:${SHORT_SHA}']
    id: push-api

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_APP_NAME}-api'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP_NAME}-images/api:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--quiet'
    id: deploy-api

  # Public access without an `allUsers` IAM binding — required verbatim
  # under orgs with the iam.allowedPolicyMemberDomains (Domain Restricted
  # Sharing) constraint, and harmless otherwise. See infra/cloudrun.tf for
  # why this isn't a Terraform resource, and scripts/deploy.sh for the twin
  # of this step. Must be restated on every deploy — a `gcloud run deploy`
  # that omits it silently reverts the service to requiring auth (2026-09-03:
  # discovered the hard way when this pipeline was first run without it).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - '${_APP_NAME}-api'
      - '--region=${_REGION}'
      - '--no-invoker-iam-check'
      - '--quiet'
    id: invoker-check-api
    waitFor: ['deploy-api']

  # ── Web ────────────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP_NAME}-images/web:${SHORT_SHA}'
      - '--build-arg'
      - 'VITE_API_URL=${_API_URL}'
      - './frontend'
    id: build-web
    waitFor: ['deploy-api']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP_NAME}-images/web:${SHORT_SHA}']
    id: push-web

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_APP_NAME}-web'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP_NAME}-images/web:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--quiet'
    id: deploy-web

  # Twin of invoker-check-api above — same reasoning, same requirement to
  # restate on every deploy.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - '${_APP_NAME}-web'
      - '--region=${_REGION}'
      - '--no-invoker-iam-check'
      - '--quiet'
    id: invoker-check-web
    waitFor: ['deploy-web']

  # ── Lock CORS down to the real web URL now that we know it ───────────────
  # Twin of the equivalent step in scripts/deploy.sh — see its comment for
  # why --no-invoker-iam-check is re-specified here too (it does not
  # reliably persist across a subsequent `gcloud run services update` call
  # that doesn't repeat it).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        set -euo pipefail
        WEB_URL=$(gcloud run services describe "${_APP_NAME}-web" --region="${_REGION}" --format='value(status.url)')
        echo "==> Restricting API CORS to $$WEB_URL"
        gcloud run services update "${_APP_NAME}-api" \
          --region="${_REGION}" \
          --update-env-vars "CORS_ORIGIN=$$WEB_URL" \
          --no-invoker-iam-check --quiet
    id: lock-cors
    waitFor: ['invoker-check-api', 'invoker-check-web']

substitutions:
  _REGION: us-central1
  _APP_NAME: oncall-pro
  _API_URL: '' # set this in the trigger config to your deployed API URL

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP_NAME}-images/api:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_APP_NAME}-images/web:${SHORT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY
